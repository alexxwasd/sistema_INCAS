<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Idioma, adaptación a móviles y recursos visuales de la pantalla de acceso. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCAS/login</title>
    <link rel="stylesheet" href="CSS/index.css?v=2">
    <link rel="icon" href="resourses/logos/INCAS_logo.png">

</head>
<body>
    <!-- Tarjeta central que reúne los logotipos y los campos del inicio de sesión. -->
    <div class="container">
        <!-- Identidad visual del instituto y del Ministerio de Educación. -->
        <img src="resourses/logos/INCAS_logo.png" alt="INCAS Logo" class="logo_INCAS">
        <img src="resourses/logos/MINED_logo.jpg" alt="MINED Logo" class="logo_MINED">

        <h1>Inicio de sesión</h1>

        <!-- Campos del inicio de sesión y acceso al formulario de matrícula. -->
        <div class="login-form">
            <form id="admin-login-form">
                <div class="input-group">
                    <label for="login-role">Tipo de cuenta</label>
                    <select id="login-role" name="role" required>
                        <option value="administrador">Administrador</option>
                        <option value="alumno">Alumno</option>
                        <option value="encargado">Encargado</option>
                        <option value="docente">Docente</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="username" id="login-identifier-label">Correo del administrador</label>
                    <input type="email" id="username" name="identifier" autocomplete="username" placeholder="Ingrese su correo" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="pin" autocomplete="current-password" inputmode="numeric" required>
                </div>
                <button class="login-button" type="submit">Iniciar sesión</button>
                <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
                <a id="admin-setup-link" class="admin-setup-link" href="configurar_admin.html" hidden>Configurar el primer administrador</a>
            </form>
            <div class="matricula-wrapper">
                <h5 class="matricula-text">Si quieres ser parte de nuestro instituto puedes matricularte aqui</h5>
                <a class="Matricula" href="matricula.html">Matricularse</a>
            </div>
        </div>
    </div>
    <script src="JS/index.js"></script>
</body>
</html>
